<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="description" content="Undergraduate exam-ready study notes + syntax-highlighted Rust & Python implementations for all three editions of Sipser's Introduction to the Theory of Computation">
<title>Theory of Computation — Study Notes + Rust &amp; Python (Sipser 1e–3e)</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.css">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/highlight.js@11.10.0/styles/github.min.css" media="(prefers-color-scheme: light)">

<script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/contrib/auto-render.min.js"></script>

<style>
:root {
  --bg: #ffffff;
  --surface: #f6f8fa;
  --border: #d0d7de;
  --text: #1f2328;
  --muted: #59636e;
  --accent: #0969da;
  --code-bg: #eff1f3;
  --rust: #dea584;
  --py: #3572a5;
  color-scheme: light dark;
}
@media (prefers-color-scheme: dark) {
  :root {
    --bg: #0d1117;
    --surface: #161b22;
    --border: #30363d;
    --text: #e6edf3;
    --muted: #8b949e;
    --accent: #58a6ff;
    --code-bg: #21262d;
  }
}
* { box-sizing: border-box; }
body {
  margin: 0;
  font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  background: var(--bg);
  color: var(--text);
  line-height: 1.65;
}
.layout {
  display: grid;
  grid-template-columns: 270px minmax(0, 1fr);
  min-height: 100vh;
}
aside {
  background: var(--surface);
  border-right: 1px solid var(--border);
  padding: 1.25rem 1rem;
  position: sticky;
  top: 0;
  height: 100vh;
  overflow-y: auto;
}
.brand { font-weight: 700; font-size: 1.05rem; margin-bottom: 0.25rem; }
.brand-sub { font-size: 0.82rem; color: var(--muted); margin-bottom: 1rem; }
.nav-section {
  font-size: 0.72rem;
  text-transform: uppercase;
  letter-spacing: 0.06em;
  color: var(--muted);
  margin: 1rem 0 0.4rem;
  font-weight: 600;
}
.nav-list { list-style: none; padding: 0; margin: 0; }
.nav-list li { margin: 0.15rem 0; }
.nav-list button, .nav-list a {
  display: block;
  width: 100%;
  text-align: left;
  background: none;
  border: none;
  color: var(--text);
  padding: 0.42rem 0.6rem;
  border-radius: 6px;
  font-size: 0.9rem;
  cursor: pointer;
  text-decoration: none;
}
.nav-list button:hover, .nav-list a:hover { background: var(--code-bg); }
.nav-list button.active { background: var(--accent); color: #fff; font-weight: 600; }

main {
  max-width: 960px;
  width: 100%;
  margin: 0 auto;
  padding: 1.8rem 2.2rem 4rem;
  transition: max-width 0.15s ease;
}
main.wide { max-width: 1440px; }

.pill {
  display: inline-block;
  border: 1px solid var(--border);
  background: var(--surface);
  border-radius: 99px;
  padding: 0.12rem 0.65rem;
  font-size: 0.8rem;
  margin-right: 0.35rem;
  color: var(--muted);
}

/* Chapter tab bar */
.chapter-header {
  display: flex;
  flex-wrap: wrap;
  justify-content: space-between;
  align-items: center;
  gap: 0.75rem;
  margin-bottom: 1.25rem;
  padding-bottom: 0.75rem;
  border-bottom: 1px solid var(--border);
}
.tabs {
  display: inline-flex;
  flex-wrap: wrap;
  gap: 0.35rem;
  background: var(--surface);
  padding: 0.25rem;
  border-radius: 8px;
  border: 1px solid var(--border);
}
.tabs button {
  background: transparent;
  border: none;
  color: var(--muted);
  padding: 0.4rem 0.8rem;
  border-radius: 6px;
  font-size: 0.88rem;
  font-weight: 500;
  cursor: pointer;
  display: inline-flex;
  align-items: center;
  gap: 0.4rem;
}
.tabs button:hover { color: var(--text); background: var(--code-bg); }
.tabs button.active { background: var(--accent); color: #fff; font-weight: 600; }
.dot { width: 8px; height: 8px; border-radius: 50%; display: inline-block; }
.dot.rust { background: var(--rust); }
.dot.py { background: var(--py); }
.gh-links { display: flex; gap: 0.5rem; flex-wrap: wrap; font-size: 0.84rem; }
.gh-links a {
  color: var(--accent);
  text-decoration: none;
  border: 1px solid var(--border);
  padding: 0.28rem 0.65rem;
  border-radius: 6px;
  background: var(--surface);
}
.gh-links a:hover { text-decoration: underline; }

/* Code viewer panel */
.code-panel {
  border: 1px solid var(--border);
  border-radius: 8px;
  overflow: hidden;
  background: var(--surface);
  margin-bottom: 1.25rem;
}
.code-panel-head {
  display: flex;
  justify-content: space-between;
  align-items: center;
  padding: 0.55rem 0.9rem;
  border-bottom: 1px solid var(--border);
  background: var(--surface);
  font-size: 0.85rem;
  gap: 0.5rem;
}
.code-panel-title {
  font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
  font-weight: 600;
  display: flex;
  align-items: center;
  gap: 0.45rem;
}
.code-panel-meta { color: var(--muted); font-size: 0.8rem; }
.code-panel-actions { display: flex; gap: 0.45rem; align-items: center; }
.btn-small {
  background: var(--bg);
  color: var(--text);
  border: 1px solid var(--border);
  padding: 0.22rem 0.6rem;
  border-radius: 5px;
  font-size: 0.8rem;
  cursor: pointer;
  text-decoration: none;
}
.btn-small:hover { border-color: var(--accent); color: var(--accent); }
.code-scroll {
  overflow-x: auto;
  background: var(--bg);
}
.code-table {
  border-collapse: collapse;
  width: 100%;
  font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
  font-size: 0.84rem;
  line-height: 1.5;
}
.code-table td { padding: 0; border: none; vertical-align: top; }
.code-table .ln {
  user-select: none;
  text-align: right;
  color: var(--muted);
  padding: 0 0.75rem 0 0.65rem;
  border-right: 1px solid var(--border);
  width: 1%;
  white-space: nowrap;
  opacity: 0.7;
}
.code-table .src {
  padding: 0 0.9rem;
  white-space: pre;
}
.code-table tr:hover td { background: var(--surface); }

.compare-grid {
  display: grid;
  grid-template-columns: repeat(2, minmax(0, 1fr));
  gap: 1rem;
  align-items: start;
}
@media (max-width: 1100px) {
  .compare-grid { grid-template-columns: 1fr; }
}

/* Markdown article */
article h1 { font-size: 1.95rem; line-height: 1.25; margin-top: 0; border-bottom: 1px solid var(--border); padding-bottom: 0.5rem; }
article h2 { font-size: 1.38rem; margin-top: 2rem; border-bottom: 1px solid var(--border); padding-bottom: 0.3rem; }
article h3 { font-size: 1.12rem; margin-top: 1.4rem; }
article a { color: var(--accent); }
article blockquote {
  margin: 1rem 0;
  padding: 0.75rem 1rem;
  border-left: 4px solid var(--accent);
  background: var(--surface);
  border-radius: 0 6px 6px 0;
}
article pre {
  background: var(--surface);
  border: 1px solid var(--border);
  padding: 0.9rem 1rem;
  border-radius: 8px;
  overflow-x: auto;
}
article code {
  background: var(--code-bg);
  padding: 0.12rem 0.35rem;
  border-radius: 4px;
  font-size: 0.9em;
}
article pre code { background: none; padding: 0; font-size: 0.86rem; }
article table {
  border-collapse: collapse;
  width: 100%;
  margin: 1rem 0;
  font-size: 0.93rem;
}
article th, article td {
  border: 1px solid var(--border);
  padding: 0.55rem 0.7rem;
  text-align: left;
  vertical-align: top;
}
article th { background: var(--surface); }

.chapter-cards {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
  gap: 0.9rem;
  margin-top: 1.2rem;
}
.card {
  border: 1px solid var(--border);
  background: var(--surface);
  border-radius: 8px;
  padding: 0.95rem 1rem;
  transition: border-color 0.15s;
}
.card:hover { border-color: var(--accent); }
.card-num { font-size: 0.78rem; color: var(--accent); font-weight: 700; text-transform: uppercase; }
.card-title { font-weight: 600; margin: 0.2rem 0 0.35rem; cursor: pointer; }
.card-desc { font-size: 0.85rem; color: var(--muted); margin: 0 0 0.7rem; }
.card-actions { display: flex; gap: 0.4rem; flex-wrap: wrap; }
.card-actions button {
  background: var(--bg);
  border: 1px solid var(--border);
  color: var(--text);
  font-size: 0.76rem;
  padding: 0.2rem 0.5rem;
  border-radius: 5px;
  cursor: pointer;
}
.card-actions button:hover { border-color: var(--accent); color: var(--accent); }

.pager {
  display: flex;
  justify-content: space-between;
  margin-top: 2.5rem;
  padding-top: 1rem;
  border-top: 1px solid var(--border);
}
.pager button {
  background: var(--surface);
  color: var(--accent);
  border: 1px solid var(--border);
  padding: 0.45rem 0.9rem;
  border-radius: 6px;
  cursor: pointer;
  font-size: 0.9rem;
}
.pager button:hover { border-color: var(--accent); }

@media (max-width: 820px) {
  .layout { grid-template-columns: 1fr; }
  aside { position: static; height: auto; border-right: none; border-bottom: 1px solid var(--border); }
  main { padding: 1.25rem 1rem 3rem; }
}
</style>
</head>
<body>
<div class="layout">
  <aside>
    <div class="brand">Theory of Computation</div>
    <div class="brand-sub">Sipser 1e–3e · Exam Study Notes + Rust &amp; Python</div>
    <div class="nav-section">Overview</div>
    <ul class="nav-list">
      <li><button id="nav-home" class="active" onclick="navigate('#home')">Course Home</button></li>
      <li><button id="nav-edition" onclick="navigate('#docs/edition-map.md')">Edition Map (1e–3e)</button></li>
      <li><button id="nav-coverage" onclick="navigate('#review/edition-coverage.md')">Coverage Audit</button></li>

  </aside>
  <main id="content"></main>
</div>

<script>
const REPO = "https://github.com/hevangel/introduction_to_the_theory_of_computation/blob/main";
const CHAPTERS = [
  { id: "00", file: "docs/00-foundations.md", rust: "src/ch00.rs", py: "python/ch00.py", title: "Ch 0: Foundations", desc: "Sets, relations, equivalence classes, graphs, proof templates, diagonalization" },
  { id: "01", file: "docs/01-regular.md", rust: "src/ch01.rs", py: "python/ch01.py", title: "Ch 1: Regular Languages", desc: "DFA, ε-NFA, subset & product constructions, Thompson regex, pumping, Myhill–Nerode (2e)" },
  { id: "02", file: "docs/02-context-free.md", rust: "src/ch02.rs", py: "python/ch02.py", title: "Ch 2: Context-Free & LR(1)", desc: "CFG, CNF, CYK, PDA, CFL pumping, DPDA, DCFL, canonical LR(1) parser (3e §2.4)" },
  { id: "03", file: "docs/03-turing.md", rust: "src/ch03.rs", py: "python/ch03.py", title: "Ch 3: Church–Turing Thesis", desc: "Single-tape & multitape TMs, NTM BFS simulation, enumerators, decidable vs recognizable" },
  { id: "04", file: "docs/04-decidability.md", rust: "src/ch04.rs", py: "python/ch04.py", title: "Ch 4: Decidability", desc: "A_DFA, E_DFA, EQ_DFA, A_CFG, E_CFG, diagonalization, A_TM, co-recognizability" },
  { id: "05", file: "docs/05-reductions.md", rust: "src/ch05.rs", py: "python/ch05.py", title: "Ch 5: Reducibility & Rice", desc: "HALT_TM, E_TM, LBA, PCP, mapping reductions, Rice's Theorem (2e)" },
  { id: "06", file: "docs/06-advanced-computability.md", rust: "src/ch06.rs", py: "python/ch06.py", title: "Ch 6: Advanced Computability", desc: "Recursion theorem (SELF), Presburger vs Peano arithmetic, Gödel, oracles, Kolmogorov" },
  { id: "07", file: "docs/07-time.md", rust: "src/ch07.rs", py: "python/ch07.py", title: "Ch 7: Time Complexity", desc: "P (2-SAT), NP verifiers, Cook–Levin tableau, 3SAT→CLIQUE→VC & SUBSET-SUM" },
  { id: "08", file: "docs/08-space.md", rust: "src/ch08.rs", py: "python/ch08.py", title: "Ch 8: Space Complexity", desc: "Savitch's CAN-YIELD, PSPACE & TQBF, L/NL, Immerman–Szelepcsényi (NL = coNL)" },
  { id: "09", file: "docs/09-intractability.md", rust: "src/ch09.rs", py: "python/ch09.py", title: "Ch 9: Intractability", desc: "Space & Time Hierarchy theorems, Baker–Gill–Solovay relativization, Boolean circuits" },
  { id: "10", file: "docs/10-advanced-complexity.md", rust: "src/ch10.rs", py: "python/ch10.py", title: "Ch 10: Advanced Complexity", desc: "2-approx VC, Miller–Rabin (2e repair), ROBP, PH, IP=PSPACE, NC, RSA" }
];

const cache = new Map();

const navEl = document.getElementById("chapter-nav");
CHAPTERS.forEach((ch) => {
  const li = document.createElement("li");
  const btn = document.createElement("button");
  btn.id = `nav-ch-${ch.id}`;
  btn.textContent = ch.title;
  btn.onclick = () => navigate(`#ch${ch.id}`);
  li.appendChild(btn);
  navEl.appendChild(li);
});

function navigate(hash) {
  if (location.hash === hash) {
    route();
  } else {
    location.hash = hash;
  }
}

function setActive(id) {
  document.querySelectorAll("aside button").forEach(b => b.classList.remove("active"));
  const el = document.getElementById(id);
  if (el) el.classList.add("active");
}

function escapeHtml(str) {
  return str.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
}

async function fetchText(path) {
  if (cache.has(path)) return cache.get(path);
  const res = await fetch(path);
  if (!res.ok) throw new Error(`HTTP ${res.status}`);
  const text = await res.text();
  cache.set(path, text);
  return text;
}

function highlightCode(source, lang) {
  if (window.hljs && window.hljs.getLanguage(lang)) {
    return window.hljs.highlight(source, { language: lang }).value;
  }
  return escapeHtml(source);
}

function splitHighlightedLines(html) {
  const rawLines = html.split("\n");
  const openTags = [];
  return rawLines.map((line) => {
    const prefix = openTags.join("");
    const tagRe = /<(\/?)span([^>]*)>/g;
    let m;
    while ((m = tagRe.exec(line)) !== null) {
      if (m[1] === "/") {
        openTags.pop();
      } else {
        openTags.push(`<span${m[2]}>`);
      }
    }
    const suffix = "</span>".repeat(openTags.length);
    return prefix + (line || " ") + suffix;
  });
}

function renderCodePanel(path, lang, label, dotClass, source) {
  const lines = source.replace(/\r\n/g, "\n").split("\n");
  if (lines.length > 1 && lines[lines.length - 1] === "") lines.pop();
  const highlighted = highlightCode(lines.join("\n"), lang);
  const hlLines = splitHighlightedLines(highlighted);
  const rows = hlLines.map((line, i) =>
    `<tr><td class="ln">${i + 1}</td><td class="src">${line}</td></tr>`
  ).join("");
  const copyId = `copy-${lang}-${Math.random().toString(36).slice(2, 8)}`;

  return `
    <section class="code-panel">
      <div class="code-panel-head">
        <div class="code-panel-title">
          <span class="dot ${dotClass}"></span>
          <span>${path}</span>
          <span class="code-panel-meta">(${label} · ${lines.length} lines)</span>
        </div>
        <div class="code-panel-actions">
          <button class="btn-small" id="${copyId}" onclick="copySource('${path}', '${copyId}')">Copy</button>
          <a class="btn-small" href="${REPO}/${path}" target="_blank" rel="noopener">GitHub ↗</a>
        </div>
      </div>
      <div class="code-scroll">
        <table class="code-table hljs"><tbody>${rows}</tbody></table>
      </div>
    </section>
  `;
}

async function copySource(path, btnId) {
  try {
    const text = await fetchText(path);
    await navigator.clipboard.writeText(text);
    const btn = document.getElementById(btnId);
    if (btn) {
      btn.textContent = "Copied!";
      setTimeout(() => { btn.textContent = "Copy"; }, 1500);
    }
  } catch (_) {}
}

function showHome() {
  setActive("nav-home");
  const main = document.getElementById("content");
  main.classList.remove("wide");
  const cards = CHAPTERS.map((ch) => `
    <div class="card">
      <div class="card-num">Chapter ${parseInt(ch.id, 10)}</div>
      <div class="card-title" onclick="navigate('#ch${ch.id}')">${ch.title.replace(/^Ch \d+:\s*/, "")}</div>
      <p class="card-desc">${ch.desc}</p>
      <div class="card-actions">
        <button onclick="navigate('#ch${ch.id}')">Study Notes</button>
        <button onclick="navigate('#ch${ch.id}/rust')">Rust</button>
        <button onclick="navigate('#ch${ch.id}/python')">Python</button>
        <button onclick="navigate('#ch${ch.id}/compare')">Side-by-Side</button>
      </div>
    </div>
  `).join("");
  main.innerHTML = `
    <article>
      <div style="margin-bottom:0.75rem">
        <span class="pill">Sipser Editions 1–3</span>
        <span class="pill">Exam Study Notes</span>
        <span class="pill">Rust + Python</span>
      </div>
      <h1>Introduction to the Theory of Computation</h1>
      <p>An open, standalone undergraduate study guide and executable companion covering all 11 chapters of Michael Sipser's <em>Introduction to the Theory of Computation</em> (1st, 2nd, and 3rd editions). Browse study notes, view syntax-highlighted <strong>Rust</strong> and <strong>Python</strong> implementations, or compare both side-by-side.</p>
      <h2>Run the Code Examples</h2>
      <pre><code class="language-bash">cargo test --all-targets
python3 -m unittest discover -s tests -v</code></pre>
      <h2>Chapters</h2>
      <div class="chapter-cards">${cards}</div>
    </article>
  `;
  highlightMarkdownCode(main);
}

function renderChapterHeader(ch, activeTab) {
  return `
    <div class="chapter-header">
      <div class="tabs" role="tablist">
        <button class="${activeTab === "notes" ? "active" : ""}" onclick="navigate('#ch${ch.id}')">Study Notes</button>
        <button class="${activeTab === "rust" ? "active" : ""}" onclick="navigate('#ch${ch.id}/rust')"><span class="dot rust"></span>Rust</button>
        <button class="${activeTab === "python" ? "active" : ""}" onclick="navigate('#ch${ch.id}/python')"><span class="dot py"></span>Python</button>
        <button class="${activeTab === "compare" ? "active" : ""}" onclick="navigate('#ch${ch.id}/compare')">Side-by-Side</button>
      </div>
      <div class="gh-links">
        <a href="${REPO}/${ch.file}" target="_blank" rel="noopener">Notes on GitHub ↗</a>
      </div>
    </div>
  `;
}

function renderPager(chIdx, tab) {
  const suffix = tab === "notes" ? "" : `/${tab}`;
  const prevBtn = chIdx > 0
    ? `<button onclick="navigate('#ch${CHAPTERS[chIdx - 1].id}${suffix}')">← ${CHAPTERS[chIdx - 1].title}</button>`
    : `<span></span>`;
  const nextBtn = chIdx < CHAPTERS.length - 1
    ? `<button onclick="navigate('#ch${CHAPTERS[chIdx + 1].id}${suffix}')">${CHAPTERS[chIdx + 1].title} →</button>`
    : `<span></span>`;
  return `<div class="pager">${prevBtn}${nextBtn}</div>`;
}

function highlightMarkdownCode(root) {
  if (!window.hljs) return;
  root.querySelectorAll("pre code").forEach((block) => {
    window.hljs.highlightElement(block);
  });
}

function wireInternalLinks(root, currentChId) {
  root.querySelectorAll("a[href]").forEach((a) => {
    const href = a.getAttribute("href");
    if (!href || href.startsWith("http://") || href.startsWith("https://") || href.startsWith("#")) return;

    const rustMatch = href.match(/src\/ch(\d\d)\.rs$/);
    if (rustMatch) {
      a.href = `#ch${rustMatch[1]}/rust`;
      return;
    }
    const pyMatch = href.match(/python\/ch(\d\d)\.py$/);
    if (pyMatch) {
      a.href = `#ch${pyMatch[1]}/python`;
      return;
    }
    const docMatch = href.match(/(?:^|\/)(\d\d)-[^/]+\.md$/);
    if (docMatch) {
      a.href = `#ch${docMatch[1]}`;
      return;
    }
    if (href.endsWith("edition-map.md")) {
      a.href = "#docs/edition-map.md";
      return;
    }
    if (href.endsWith("edition-coverage.md")) {
      a.href = "#review/edition-coverage.md";
      return;
    }
  });
}

function renderMarkdownWithMath(md) {
  // 1. Protect fenced code blocks and inline code spans so `$` inside code is untouched.
  const codeStore = [];
  let text = md.replace(/```[\s\S]*?```|`[^`\n]+`/g, (match) => {
    const idx = codeStore.length;
    codeStore.push(match);
    return `CODEPLACEHOLDER${idx}END`;
  });

  // 2. Extract display math ($$...$$) and inline math ($...$, supporting \$ inside)
  // BEFORE marked.parse() so Markdown never strips backslashes (\{, \}, \#, \;, \$) or eats `_`.
  const mathStore = [];
  text = text.replace(/\$\$([\s\S]+?)\$\$/g, (_, expr) => {
    const idx = mathStore.length;
    mathStore.push({ expr: expr.trim(), display: true });
    return `MATHPLACEHOLDER${idx}END`;
  });
  text = text.replace(/(?<!\\)\$(?!\$)((?:\\\$|[^$\n])+?)(?<!\\)\$/g, (_, expr) => {
    const idx = mathStore.length;
    mathStore.push({ expr, display: false });
    return `MATHPLACEHOLDER${idx}END`;
  });

  // 3. Restore code blocks so marked.parse() renders them normally.
  text = text.replace(/CODEPLACEHOLDER(\d+)END/g, (_, idx) => codeStore[Number(idx)]);

  // 4. Parse Markdown to HTML.
  let html = window.marked ? window.marked.parse(text) : `<pre>${escapeHtml(text)}</pre>`;

  // 5. Render each math placeholder directly with KaTeX (immune to Markdown/HTML mangling).
  html = html.replace(/MATHPLACEHOLDER(\d+)END/g, (_, idx) => {
    const item = mathStore[Number(idx)];
    if (window.katex && window.katex.renderToString) {
      return window.katex.renderToString(item.expr, {
        displayMode: item.display,
        throwOnError: false,
      });
    }
    return item.display ? `$$${escapeHtml(item.expr)}$$` : `$${escapeHtml(item.expr)}$`;
  });

  return html;
}

async function showChapter(chIdx, tab) {
  const ch = CHAPTERS[chIdx];
  setActive(`nav-ch-${ch.id}`);
  const main = document.getElementById("content");
  main.classList.toggle("wide", tab === "compare");
  main.innerHTML = `${renderChapterHeader(ch, tab)}<p>Loading...</p>`;

  try {
    let bodyHtml = "";
    if (tab === "notes") {
      const md = await fetchText(ch.file);
      bodyHtml = `<article id="md-body">${renderMarkdownWithMath(md)}</article>`;
    } else if (tab === "rust") {
      const code = await fetchText(ch.rust);
      bodyHtml = renderCodePanel(ch.rust, "rust", "Rust", "rust", code);
    } else if (tab === "python") {
      const code = await fetchText(ch.py);
      bodyHtml = renderCodePanel(ch.py, "python", "Python", "py", code);
    } else if (tab === "compare") {
      const [rustCode, pyCode] = await Promise.all([fetchText(ch.rust), fetchText(ch.py)]);
      bodyHtml = `
        <div class="compare-grid">
          ${renderCodePanel(ch.rust, "rust", "Rust", "rust", rustCode)}
          ${renderCodePanel(ch.py, "python", "Python", "py", pyCode)}
        </div>
      `;
    }

    main.innerHTML = `${renderChapterHeader(ch, tab)}${bodyHtml}${renderPager(chIdx, tab)}`;

    if (tab === "notes") {
      const mdBody = document.getElementById("md-body");
      wireInternalLinks(mdBody, ch.id);
      highlightMarkdownCode(mdBody);
    }
    window.scrollTo(0, 0);
  } catch (err) {
    main.innerHTML = `${renderChapterHeader(ch, tab)}<article><h1>${ch.title}</h1><p>Could not load content (${escapeHtml(err.message)}). <a href="${REPO}/${ch.file}" target="_blank" rel="noopener">View on GitHub ↗</a></p></article>`;
  }
}

async function showStandaloneDoc(path, title, navId) {
  setActive(navId);
  const main = document.getElementById("content");
  main.classList.remove("wide");
  main.innerHTML = `<p>Loading <code>${path}</code>...</p>`;
  try {
    const md = await fetchText(path);
    main.innerHTML = `
      <div class="chapter-header">
        <span class="pill">${title}</span>
        <div class="gh-links"><a href="${REPO}/${path}" target="_blank" rel="noopener">View Markdown on GitHub ↗</a></div>
      </div>
      <article id="md-body">${renderMarkdownWithMath(md)}</article>
    `;
    const mdBody = document.getElementById("md-body");
    wireInternalLinks(mdBody, null);
    highlightMarkdownCode(mdBody);
    window.scrollTo(0, 0);
  } catch (err) {
    main.innerHTML = `<article><h1>${title}</h1><p>Could not load <code>${path}</code> (${escapeHtml(err.message)}).</p></article>`;
  }
}

function route() {
  const hash = location.hash.replace(/^#/, "");
  const m = hash.match(/^ch(\d\d)(?:\/(notes|rust|python|compare))?$/);
  if (m) {
    const idx = CHAPTERS.findIndex(c => c.id === m[1]);
    if (idx >= 0) return showChapter(idx, m[2] || "notes");
  }
  if (hash === "docs/edition-map.md") return showStandaloneDoc("docs/edition-map.md", "Edition Map (1e–3e)", "nav-edition");
  if (hash === "review/edition-coverage.md") return showStandaloneDoc("review/edition-coverage.md", "Edition Coverage Audit", "nav-coverage");
  showHome();
}

window.addEventListener("hashchange", route);
window.addEventListener("load", route);
</script>
</body>
